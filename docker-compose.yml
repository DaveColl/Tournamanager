# Starts both containers together and puts them on the same network so they
# can reach each other by service name (e.g. "backend"). Run with:
# docker compose up --build
services:
  # The Flask JSON API
  backend:
    build: ./backend
    #needs to be removed in the future
    ports:
      - 5000:5000
    depends_on:
      # Makes sure "database" is started before "backend" (does not wait for 
      # it to be fully ready, just for the container to start)
      - database
    restart: unless-stopped
    
  # The Flask app that renders the HTML page. It calls the backend itself
  # (server-side, in Python) and fills the template with the result -
  # no JavaScript needed for that part, only for the 30s live refresh.
  frontend:
    build: ./frontend
    ports:
      # host_port:container_port - this one IS published, since it's the
      # page your browser actually opens.
      - "8080:5000"
    depends_on:
      # Makes sure "backend" is started before "frontend" (does not wait for
      # it to be fully ready, just for the container to start)
      - backend
    restart: unless-stopped
  database:
    image: mysql:8.0
    container_name: tournamanager-database
    environment:
      MYSQL_ROOT_PASSWORD: "Password123"
      MYSQL_DATABASE: Turnier_DB
      MYSQL_USER: Turnier_Admin
      MYSQL_PASSWORD: "?bBxar1v{V1>Ty/h-qH"
    ports:
      # Opens port 3306 for external database management tools on the host machine (MySQL Workbench)
      - "127.0.0.1:3306:3306"
    volumes:
      # Keeps all database records persistent so data isn't lost after a restart
      - db_data:/var/lib/mysql
      #Automatically executes the init.sql script when creating the database for the first time
      - ./Database/init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
volumes:
  # Declares the global volume where Docker physically saves the database files
  db_data: