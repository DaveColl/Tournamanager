<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tournamanager</title>
</head>

<body>
    <h1>Tournamanager</h1>

    <!-- backend_data is set in frontend/main.py: None if the backend could
         not be reached, otherwise the JSON it returned -->
    {% if backend_data %}
        <p>Backend says: {{ backend_data.status }} ({{ backend_data.service }})</p>
    {% else %}
        <p>Backend unreachable.</p>
    {% endif %}
</body>

</html>
